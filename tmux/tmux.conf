# Enable mouse tracking so normal click-and-drag works
set -g mouse on

# Turn on OSC 52 clipboard sequences
set -s set-clipboard on

# Explicitly tell tmux that Kitty supports clipboard forwarding
set -as terminal-features ',xterm-kitty:clipboard'

# Stay in copy mode and copy to system clipboard when mouse dragging stops
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

