# Enable remote control to do things like:
# kitty @ launch --location=vsplit --cwd=current 
allow_remote_control yes

# Shortcuts to open vsplit / hsplit window WITH current CWD
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+h launch --location=hsplit --cwd=current

# ---- Bell ----
enable_audio_bell no 
command_on_bell canberra-gtk-play -i bell
notify_on_cmd_finish invisible 20

# ---- Window ----
remember_window_size  yes
initial_window_width  640
initial_window_height 400

# ---- Font ----
font_size 12

# ---- Clipboard (esp with tmux) ----
copy_on_select yes
clipboard_control write-clipboard write-primary read-clipboard read-primary no_append

# ---- Tabs ----
tab_bar_style powerline
tab_title_template "{index}: {title}"

# ---- Performance ----
scrollback_lines 5000
scrollback_pager_history_size 10
repaint_delay 8
input_delay 0

# ---- Tall Layout ----------
enabled_layouts tall:bias=60;full_size=1;mirrored=false,stack,grid

map ctrl+shift+l next_layout


map ctrl+[ layout_action decrease_num_full_size_windows
map ctrl+] layout_action increase_num_full_size_windows
map ctrl+/ layout_action mirror toggle
map ctrl+y layout_action mirror true
map ctrl+n layout_action mirror false

# Focus neighboring windows using arrow keys
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# change size using Ctrl+,
map ctrl+, layout_action bias 40 50 62 70 76 

