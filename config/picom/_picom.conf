# --- Backend Configuration ---
backend = "glx";
vsync = true;

#################################
#             Blur              #
#################################

blur: {
    method = "dual_kawase";
    strength = 5;  # Lower number = less blur. Try 5-10 for a start.
    # deviation = 1.0; (Only needed for 'gaussian' method)
}

# Enable background blur for transparent windows
blur-background = true;

# Exclude specific windows from having their background blurred (e.g., docks, fullscreen windows)
blur-background-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Optional: If your performance is great, you can try this.
# blur-background-frame = true;
